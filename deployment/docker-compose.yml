version: '3.8'

services:
  api:
    build:
      context: ../
      dockerfile: deployment/Dockerfile
    container_name: customer_intelligence_api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
      - ../models:/app/models
    environment:
      - PYTHONUNBUFFERED=1

  dashboard:
    build:
      context: ../
      dockerfile: deployment/Dockerfile
    container_name: customer_intelligence_dashboard
    command: streamlit run dashboard/app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      - api
    volumes:
      - ../data:/app/data
      - ../models:/app/models
    environment:
      - API_URL=http://api:8000
      - PYTHONUNBUFFERED=1
